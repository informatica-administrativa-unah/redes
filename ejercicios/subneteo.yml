# Ejercicios de subneteo con revisión automática
#
# Cómo se usa:
#   1. Escribí cada respuesta después de los dos puntos, en la misma línea.
#   2. No cambiés los nombres de los campos ni borrés líneas.
#   3. Las máscaras se aceptan como 255.255.255.192, como /26 o como 26.
#   4. Revisá con: python herramientas/revisar.py
#   5. Hacé commit y push: GitHub corre el mismo revisor y te muestra el resultado en Actions.
#
# Trabajá en papel primero. El revisor te dice qué campo no cuadra y te da una pista, no la respuesta.

